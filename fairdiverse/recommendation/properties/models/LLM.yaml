{
  # for share setting
  max_tokens: 256,
  temperature: 0.8,

  # for api llm
  api_key: http://localhost:8000/v1,
  api_base: EMPTY,



  # for local llm and vllm and grounding
  llm_path_dict: {
      'Llama3': "meta-llama/Meta-Llama-3.1-8B-Instruct",
      'bert': "google-bert/bert-base-uncased",
      'gpt2': "openai-community/gpt2",
  } ,

  # for local llm, and grounding
  use_8bit: True,
  device_map: auto,

  # for vllm
  use_batch: True
}